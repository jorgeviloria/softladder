[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.82"
repository = "https://github.com/jorgeviloria/softladder"

[workspace.dependencies]
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Errors and logging
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI
# `~4.5` keeps clap's MSRV (1.74) below the workspace `rust-version`.
clap = { version = "~4.5", features = ["derive"] }

# Compression (`.slprjz` project container)
flate2 = "1.0"

# Desktop UI.
# Pinned to the 0.31 series: it is the newest eframe/egui release whose MSRV
# (1.81) is compatible with the workspace `rust-version` of 1.82.
eframe = "0.31"
egui = "0.31"
# Native file dialogs. The default `xdg-portal` backend on Linux is pure Rust,
# so it needs no GTK headers at build time.
rfd = "0.15"

# Test-only helpers
tempfile = "3.10"
insta = { version = "1.40", features = ["json"] }
proptest = "1.5"
