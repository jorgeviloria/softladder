<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SoftLadder dashboard</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 2em; max-width: 60em; }
  table { border-collapse: collapse; margin: 1em 0; }
  th, td { border: 1px solid #ccc; padding: 0.3em 0.8em; text-align: left; }
  .mono { font-family: monospace; }
  #error { color: #a00; }
</style>
</head>
<body>
<h1>SoftLadder dashboard</h1>
<p>Token: <input id="token" size="20" value="view-1"> <button onclick="refresh()">Refresh</button></p>
<p id="error"></p>
<h2>Status</h2>
<pre id="status" class="mono">…</pre>
<h2>Variables</h2>
<p>Comma-separated, e.g. <span class="mono">%Q0, %MW3</span>:
<input id="vars" size="30" value="%Q0">
<button onclick="refresh()">Watch</button></p>
<table><thead><tr><th>Variable</th><th>Value</th></tr></thead><tbody id="values"></tbody></table>
<h2>Alarms</h2>
<table><thead><tr><th>Code</th><th>Severity</th><th>Message</th><th>Acked</th></tr></thead><tbody id="alarms"></tbody></table>
<script>
async function api(path) {
  const token = encodeURIComponent(document.getElementById("token").value);
  const sep = path.includes("?") ? "&" : "?";
  const response = await fetch(path + sep + "token=" + token);
  return response.json();
}
function show(value) {
  if (value === null || value === undefined) return "?";
  if (typeof value === "object") {
    if ("Bit" in value) return value.Bit ? "1" : "0";
    if ("Word" in value) return String(value.Word);
    if ("DWord" in value) return String(value.DWord);
    if ("Real" in value) return String(value.Real);
  }
  return JSON.stringify(value);
}
async function refresh() {
  try {
    document.getElementById("error").textContent = "";
    const status = await api("/api/status");
    document.getElementById("status").textContent = JSON.stringify(status);
    const names = document.getElementById("vars").value.split(",").map(s => s.trim()).filter(Boolean);
    const query = names.map(v => "var=" + encodeURIComponent(v)).join("&");
    const vars = await api("/api/vars" + (query ? "?" + query : ""));
    const rows = (vars.values || []).map(([name, value]) =>
      `<tr><td class="mono">${name}</td><td class="mono">${show(value)}</td></tr>`).join("");
    document.getElementById("values").innerHTML = rows;
    const alarms = await api("/api/alarms");
    document.getElementById("alarms").innerHTML = (alarms.alarms || []).map(a =>
      `<tr><td class="mono">${a.code}</td><td>${a.severity}</td><td>${a.message}</td><td>${a.acked ? "yes" : "no"}</td></tr>`).join("");
  } catch (e) {
    document.getElementById("error").textContent = "request failed: " + e;
  }
}
refresh();
setInterval(refresh, 2000);
</script>
</body>
</html>
