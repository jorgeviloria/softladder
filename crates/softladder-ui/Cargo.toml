[package]
name = "softladder-ui"
description = "eframe/egui desktop editor for SoftLadder"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lib]
name = "softladder_ui"
path = "src/lib.rs"

[[bin]]
name = "softladder-editor"
path = "src/main.rs"

[dependencies]
softladder-core = { path = "../softladder-core" }
softladder-edit = { path = "../softladder-edit" }
softladder-project = { path = "../softladder-project" }
eframe = { workspace = true }
egui = { workspace = true }
rfd = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# The UI is reviewed through headless screenshots; see tests/ui_shots.rs.
image = { workspace = true }
